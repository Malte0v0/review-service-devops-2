name: promote.yml
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Git SHA to promote to production"
        required: true
        type: string

jobs:
  promote:
    runs-on: [ubuntu-latest]
    environment: production
    steps:
      - run: echo "Promoting ${{inputs.version}}"

      - name: Login to Dockerhub
        run: echo ${{secrets.DOCKERHUB_TOKEN}} | docker login -u ${{secrets.DOCKERHUB_USERNAME}} --password-stdin

      - name: pull image
        run: |
          docker pull ${{secrets.DOCKERHUB_USERNAME}}/review-service:${{inputs.version}}

      - name: retag image
        run: |
          docker tag ${{secrets.DOCKERHUB_USERNAME}}/review-service:${{inputs.version}} ${{secrets.DOCKERHUB_USERNAME}}/review-service:production

      - name: push image
        run: |
          docker push ${{secrets.DOCKERHUB_USERNAME}}/review-service:production